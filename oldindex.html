<!DOCTYPE html>
 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Planner</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
 
<nav class="nav">
  <h2>🍽 Meal Planner</h2>
  <div>
    <button onclick="showPage('planner')">Planner</button>
    <button onclick="showPage('grocery')">Grocery</button>
    <button onclick="showPage('pantry')">Pantry</button>
    <button onclick="showPage('recipes')">Recipes</button>
  </div>
</nav>
 
<section id="planner" class="page">
  <h1>Weekly Planner</h1>
  <div id="plannerGrid"></div>
</section>
 
<section id="grocery" class="page hidden">
  <h1>Grocery List</h1>
  <input id="groceryInput" placeholder="Item"/>
  <input id="priceInput" placeholder="Price"/>
  <button onclick="addGrocery()">Add</button>
  <ul id="groceryList"></ul>
  <h3 id="totalCost"></h3>
</section>
 
<section id="pantry" class="page hidden">
  <h1>Pantry</h1>
  <input id="pantryInput" placeholder="Ingredient"/>
  <button onclick="addPantry()">Add</button>
  <ul id="pantryList"></ul>
</section>
 
<section id="recipes" class="page hidden">
  <h1>Recipes</h1>
  <button onclick="fetchRecipes()">Get Recipes</button>
  <button onclick="suggestRecipes()">Suggest From Pantry</button>
 
  <div id="recipesContainer"></div>
 
  <h3>Add Custom Recipe</h3>
  <input id="recipeName" placeholder="Name"/>
  <input id="recipeURL" placeholder="URL"/>
  <input id="recipeImage" placeholder="Image URL"/>
  <textarea id="recipeInstructions" placeholder="Instructions"></textarea>
  <button onclick="addCustomRecipe()">Add</button>
</section>
 
<script src="app.js"></script>
 
</body>
</html>
